<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daybook</title>
<meta name="description" content="Habits, mood, time log and job hunt tracker with insights.">
<meta name="theme-color" content="#2c49d1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daybook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}

/* Layout: a planner-style one-column app — sticky date bar, tab strip, one working panel per tab; cobalt ink with a marigold highlighter for streaks. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --sunk:#e4e8f0; --ink:#141c33; --muted:#5a6580; --line:#d8deea;
  --accent:#2c49d1; --accent-ink:#ffffff; --accent-soft:#e2e8ff; --mark:#f0a30f; --mark-soft:#fff1d2;
  --good:#16865a; --warn:#b86b00; --bad:#c23a3a;
  --c1:#2c49d1; --c2:#f0a30f; --c3:#16865a; --c4:#c23a8a; --c5:#0e8fa8; --c6:#8a5cd6; --c7:#c25a2a; --c8:#7a8499;
  --h0:#e4e8f0; --h1:#c7d2fb; --h2:#8fa3f2; --h3:#2c49d1;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1220; --surface:#151c2e; --sunk:#1c2439; --ink:#e7ebf4; --muted:#95a1bc; --line:#27314a;
  --accent:#7d95ff; --accent-ink:#0d1220; --accent-soft:#222d52; --mark:#f6b73c; --mark-soft:#3a2d12;
  --good:#3cc58a; --warn:#e8a23a; --bad:#f07070;
  --c1:#7d95ff; --c2:#f6b73c; --c3:#3cc58a; --c4:#e56bb4; --c5:#41c2d8; --c6:#ad8af0; --c7:#ec8a5a; --c8:#8b95ab;
  --h0:#1c2439; --h1:#2b3866; --h2:#4c62b8; --h3:#7d95ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1220; --surface:#151c2e; --sunk:#1c2439; --ink:#e7ebf4; --muted:#95a1bc; --line:#27314a;
  --accent:#7d95ff; --accent-ink:#0d1220; --accent-soft:#222d52; --mark:#f6b73c; --mark-soft:#3a2d12;
  --good:#3cc58a; --warn:#e8a23a; --bad:#f07070;
  --c1:#7d95ff; --c2:#f6b73c; --c3:#3cc58a; --c4:#e56bb4; --c5:#41c2d8; --c6:#ad8af0; --c7:#ec8a5a; --c8:#8b95ab;
  --h0:#1c2439; --h1:#2b3866; --h2:#4c62b8; --h3:#7d95ff; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1}
.brand span{background:linear-gradient(transparent 58%,var(--mark-soft) 58%);padding:0 2px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)}
.datenav{display:flex;align-items:center;gap:6px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;font-size:16px}
.datelabel{font-family:var(--f-display);font-weight:700;font-size:16px;min-width:9.5em;text-align:center}
.datelabel small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.todaybtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:34px;padding:0 10px;font-size:13px;font-weight:600}

.tabs{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}

.banner{margin-top:14px;background:var(--mark-soft);border:1px solid var(--mark);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner p{margin:0;font-size:14px;max-width:52ch}
.banner b{font-weight:600}

main{display:grid;gap:16px;margin-top:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0 0 4px;text-wrap:balance}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* habits */
.habits{display:grid;gap:6px}
.habit{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.habit .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:var(--accent-ink)}
.habit.on{background:var(--accent-soft);border-color:transparent}
.habit.on .box{background:var(--accent);border-color:var(--accent)}
.habit .nm{flex:1;min-width:0;font-weight:500}
.streak{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.streak.hot{background:var(--mark-soft);color:var(--warn)}
.progress{height:6px;border-radius:99px;background:var(--sunk);margin:4px 0 14px;overflow:hidden}
.progress b{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.manage{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.chipx{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:99px;padding:4px 6px 4px 12px;font-size:13px}
.chipx button{border:0;background:transparent;color:var(--muted);width:22px;height:22px;border-radius:50%}
.chipx button:hover{background:var(--line);color:var(--bad)}

/* scales */
.scale{display:grid;gap:6px;margin-bottom:14px}
.scale .opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 2px;font-size:12px;line-height:1.2;color:var(--muted)}
.scale button b{display:block;font-family:var(--f-mono);font-size:16px;color:var(--ink);font-weight:500}
.scale button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale button.on b{color:var(--accent-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.field{display:grid;gap:4px;min-width:0}
.field.grow{flex:1 1 160px}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:84px;line-height:1.5}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.hint{font-size:12px;color:var(--muted)}

/* time */
.stack{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--sunk);margin:6px 0 10px}
.stack span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.entries{list-style:none;margin:14px 0 0;padding:0;display:grid}
.entries li{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.entries .when{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.entries .what{min-width:0}
.entries .what b{font-weight:600}
.entries .what span{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.entries .dur{font-family:var(--f-mono);font-size:13px}
.del{border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:6px}
.del:hover{color:var(--bad);background:var(--sunk)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:8px;margin-top:12px}

/* jobs */
.funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:6px}
.fstep{background:var(--sunk);border-radius:8px;padding:10px 12px}
.fstep b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500}
.fstep span{font-size:12px;color:var(--muted)}
.jobs{width:100%;border-collapse:collapse;font-size:14px}
.tablewrap{overflow-x:auto;margin-top:12px}
.jobs th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.jobs td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.jobs td.co b{font-weight:600}
.jobs td.co span{display:block;font-size:12px;color:var(--muted)}
.pill{font-size:12px;font-weight:600;border-radius:99px;padding:4px 8px;border:0;appearance:none;-webkit-appearance:none;cursor:pointer;width:auto}
.s-Applied{background:var(--accent-soft);color:var(--accent)}
.s-OA{background:var(--mark-soft);color:var(--warn)}
.s-Interview{background:var(--mark-soft);color:var(--warn)}
.s-Offer{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.s-Rejected{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.s-Ghosted{background:var(--sunk);color:var(--muted)}
.age{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.age.nudge{color:var(--warn)}

/* insights */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.findings{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.findings li{padding:10px 12px;background:var(--sunk);border-radius:8px;font-size:14px;max-width:70ch}
.findings li b{font-weight:600}
.heat{display:grid;gap:4px;min-width:560px}
.heat .hr{display:grid;grid-template-columns:130px repeat(28,1fr);gap:3px;align-items:center}
.heat .hn{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.heat .c{aspect-ratio:1;border-radius:3px;background:var(--h0)}
.heat .c.on{background:var(--h3)}
.heat .c.today{outline:1.5px solid var(--mark);outline-offset:1px}
.heat .axis{font-size:10px;color:var(--muted);font-family:var(--f-mono);text-align:center}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.hbars{display:grid;gap:8px}
.hbar{display:grid;grid-template-columns:96px 1fr 52px;gap:10px;align-items:center;font-size:13px}
.hbar .t{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.hbar .t b{display:block;height:100%;border-radius:4px}
.hbar .v{font-family:var(--f-mono);font-size:12px;text-align:right}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:520px){
  .datelabel{min-width:7.5em;font-size:15px}
  .entries li{grid-template-columns:1fr auto auto}
  .entries .when{grid-column:1/-1;margin-bottom:-6px}
  .hbar{grid-template-columns:78px 1fr 46px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.sync.saving i{background:var(--mark)}
.sync.off i{background:var(--warn)}
.auth{max-width:400px;margin:48px auto;display:grid;gap:14px}
.auth h1{font-family:var(--f-display);font-weight:800;font-size:44px;letter-spacing:-.03em;margin:0;line-height:1}
.auth h1 span{background:linear-gradient(transparent 58%,var(--mark-soft) 58%);padding:0 3px}
.auth p{margin:0;color:var(--muted);max-width:40ch}
.auth .err{color:var(--bad);font-size:14px;min-height:1.4em}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;padding:0;text-align:left}
.acct{display:grid;gap:10px}
.acct .row .btn{flex:0 0 auto}
</style>
</head>
<body>
<div class="wrap">
  <section class="auth" id="authview" hidden>
    <h1><span>Daybook</span></h1>
    <p id="authsub">Sign in to sync your habits, check-ins, time log and job hunt across your laptop and phone.</p>
    <form id="authform" class="panel" style="display:grid;gap:12px">
      <div class="field"><label class="label" for="aemail">Email</label><input type="text" inputmode="email" autocomplete="email" id="aemail" required></div>
      <div class="field"><label class="label" for="apass">Password</label><input type="password" autocomplete="current-password" id="apass" minlength="6" required></div>
      <button class="btn" id="asubmit">Sign in</button>
      <div class="err" id="aerr" role="alert"></div>
      <button type="button" class="linkbtn" id="amode">New here? Create an account</button>
    </form>
  </section>

  <div id="appview" hidden>
    <header class="top">
      <div class="bar">
        <div>
          <div class="brand"><span>Daybook</span></div>
          <div class="sync" id="sync"><i></i><span>Connecting…</span></div>
        </div>
        <div class="datenav">
          <button class="iconbtn" id="prev" aria-label="Previous day">‹</button>
          <div class="datelabel" id="datelabel"></div>
          <button class="iconbtn" id="next" aria-label="Next day">›</button>
          <button class="todaybtn" id="gotoday">Today</button>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <a href="#today" data-tab="today">Today</a>
        <a href="#time" data-tab="time">Time log</a>
        <a href="#jobs" data-tab="jobs">Job hunt</a>
        <a href="#insights" data-tab="insights">Insights</a>
        <a href="#account" data-tab="account">Account</a>
      </nav>
    </header>
    <main id="view"></main>
  </div>
  <div class="loading" id="boot">Opening your daybook…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d=parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const uid = () => Math.random().toString(36).slice(2,10);
const clone = o => JSON.parse(JSON.stringify(o ?? {}));
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtH = m => { const h=Math.floor(m/60), mm=Math.round(m%60); return h? (h+"h"+(mm? " "+mm+"m":"")) : mm+"m"; };
const mins = t => { if(!t) return null; const [h,m]=t.split(":").map(Number); return h*60+m; };
const dur = e => { const a=mins(e.start), b=mins(e.end); if(a==null||b==null) return 0; let d=b-a; if(d<=0) d+=1440; return d; };
const avg = a => a.length? a.reduce((s,x)=>s+x,0)/a.length : null;
const fx = (n,d=1) => n==null? "–" : n.toFixed(d);

const CATS = [
  {id:"study",name:"Study",c:"--c1"},{id:"jobs",name:"Job hunt",c:"--c2"},{id:"work",name:"Projects",c:"--c3"},
  {id:"exercise",name:"Exercise",c:"--c5"},{id:"social",name:"Family & friends",c:"--c4"},{id:"leisure",name:"Leisure",c:"--c6"},
  {id:"commute",name:"Commute",c:"--c7"},{id:"other",name:"Other",c:"--c8"}];
const catOf = id => CATS.find(c=>c.id===id) || CATS[CATS.length-1];
const STATUSES = ["Applied","OA","Interview","Offer","Rejected","Ghosted"];
const SCALES = {
  mood:{label:"Mood",words:["Rough","Low","Okay","Good","Great"]},
  energy:{label:"Energy",words:["Drained","Tired","Steady","Sharp","Wired"]},
  prod:{label:"Productivity",words:["None","Little","Some","Solid","Huge"]}};
const DEFAULT_HABITS = [
  {id:"h-workout",name:"Workout"},{id:"h-read",name:"Read 20 min"},{id:"h-sql",name:"Practice SQL / Python"},
  {id:"h-apply",name:"Apply to 2 jobs"},{id:"h-water",name:"Drink 3L water"},{id:"h-screen",name:"No phone after 11 pm"}];

/* ---------- Supabase ---------- */
const CFG = window.DAYBOOK_CONFIG || {};
const configured = CFG.SUPABASE_URL && !/YOUR-PROJECT/.test(CFG.SUPABASE_URL) && CFG.SUPABASE_ANON_KEY && !/PASTE/.test(CFG.SUPABASE_ANON_KEY);
const sb = (configured && window.supabase) ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth:{persistSession:true,autoRefreshToken:true}}) : null;

/* ---------- store: local cache first, synced to Supabase ---------- */
const Store = {
  user:null, cache:{}, dirty:{}, timer:null, pushing:false, again:false, state:"ok",
  lk(){ return "daybook-cache:"+this.user.id; }, dk(){ return "daybook-dirty:"+this.user.id; },
  loadLocal(){ try{ this.cache=JSON.parse(localStorage.getItem(this.lk()))||{}; this.dirty=JSON.parse(localStorage.getItem(this.dk()))||{}; }catch(e){ this.cache={}; this.dirty={}; } },
  saveLocal(){ try{ localStorage.setItem(this.lk(),JSON.stringify(this.cache)); localStorage.setItem(this.dk(),JSON.stringify(this.dirty)); }catch(e){} },
  get(id){ return this.cache[id]; },
  all(){ return this.cache; },
  save(id,data,delay){
    this.cache[id]=data; this.dirty[id]=true; this.saveLocal();
    clearTimeout(this.timer); this.timer=setTimeout(()=>this.push(), delay==null?300:delay);
    setSync("saving");
  },
  async pull(){
    await this.push();
    const {data,error} = await sb.from("entries").select("key,data");
    if(error) throw error;
    (data||[]).forEach(r=>{ if(!this.dirty[r.key]) this.cache[r.key]=r.data; });
    this.saveLocal();
  },
  async push(){
    if(this.pushing){ this.again=true; return; }
    const keys=Object.keys(this.dirty);
    if(!keys.length){ setSync("ok"); return; }
    if(!navigator.onLine){ setSync("off"); return; }
    this.pushing=true; setSync("saving");
    const snap={}; keys.forEach(k=>snap[k]=JSON.stringify(this.cache[k]??{}));
    const now=new Date().toISOString();
    const rows=keys.map(k=>({user_id:this.user.id,key:k,data:this.cache[k]??{},updated_at:now}));
    const {error} = await sb.from("entries").upsert(rows,{onConflict:"user_id,key"});
    this.pushing=false;
    if(error){ setSync("off"); toast("Couldn't sync. Your changes are kept on this device and will sync later."); return; }
    keys.forEach(k=>{ if(JSON.stringify(this.cache[k]??{})===snap[k]) delete this.dirty[k]; });
    this.saveLocal();
    if(this.again || Object.keys(this.dirty).length){ this.again=false; return this.push(); }
    setSync("ok");
  }
};
function setSync(s){
  Store.state=s; const el=$("#sync"); if(!el) return;
  el.className="sync "+(s==="ok"?"ok":s);
  el.querySelector("span").textContent = s==="ok"? "Synced" : s==="saving"? "Saving…" : "Offline · will sync";
}
window.addEventListener("online",()=>Store.user && Store.push());

const setDay = (k,fn,delay) => { const d=clone(getDay(k)); d.habits=d.habits||{}; d.time=d.time||[]; fn(d); Store.save("d-"+k,d,delay); };
const habits = () => (Store.get("settings")||{}).habits || [];
const jobs = () => (Store.get("jobs")||{}).items || [];
const done = (k,h) => !!((Store.get("d-"+k)||{}).habits||{})[h];
function streak(h){
  let k=todayKey(); if(!done(k,h)) k=addDays(k,-1);
  let n=0; while(done(k,h) && n<999){ n++; k=addDays(k,-1); } return n;
}

/* ---------- csv ---------- */
const csvCell = v => { const s=String(v??""); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; };
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=c;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>x!==""));
}
function daysCSV(){
  const hs=habits(), all=Store.all();
  const keys=Object.keys(all).filter(k=>k.startsWith("d-")).map(k=>k.slice(2)).sort();
  const head=["date","weekday","mood","energy","productivity","sleep_hours","habits_done","habits_total",...hs.map(h=>"habit_"+h.name),...CATS.map(c=>"min_"+c.id),"journal"];
  const rows=keys.map(k=>{ const d=all["d-"+k]; const by={}; (d.time||[]).forEach(e=>by[e.cat]=(by[e.cat]||0)+dur(e));
    return [k,DOW[parseKey(k).getDay()],d.mood,d.energy,d.prod,d.sleep,hs.filter(h=>d.habits&&d.habits[h.id]).length,hs.length,...hs.map(h=>d.habits&&d.habits[h.id]?1:0),...CATS.map(c=>by[c.id]||0),d.note]; });
  return [head,...rows].map(r=>r.map(csvCell).join(",")).join("\n");
}
function jobsCSV(){
  return [["company","role","applied_on","status"],...jobs().map(j=>[j.company,j.role,j.date,j.status])].map(r=>r.map(csvCell).join(",")).join("\n");
}
async function exportFile(name,data){
  const blob=new Blob([data],{type:"text/csv"});
  const iosApp = /iPhone|iPad|iPod/.test(navigator.userAgent) && (window.navigator.standalone || matchMedia("(display-mode: standalone)").matches);
  try{
    const file=new File([blob],name,{type:"text/csv"});
    if(iosApp && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
  toast("Downloaded "+name);
}
function importCSV(text){
  const rows=parseCSV(text); if(rows.length<2) return "That file has no rows.";
  const head=rows[0].map(h=>h.trim()); const ix=n=>head.indexOf(n);
  if(ix("company")>=0){
    const j=clone(Store.get("jobs")||{items:[]}); j.items=j.items||[]; let n=0;
    rows.slice(1).forEach(r=>{ const company=(r[ix("company")]||"").trim(); if(!company) return;
      const role=(r[ix("role")]||"").trim(), date=(r[ix("applied_on")]||todayKey()).trim(), st=(r[ix("status")]||"Applied").trim();
      if(j.items.some(x=>x.company===company&&x.role===role&&x.date===date)) return;
      j.items.push({id:uid(),company,role,date,status:STATUSES.includes(st)?st:"Applied"}); n++; });
    Store.save("jobs",j); return `Imported ${n} application${n===1?"":"s"}.`;
  }
  if(ix("date")>=0){
    const s=clone(Store.get("settings")||{habits:[]}); s.habits=s.habits||[];
    const hcols=head.map((h,i)=>({h,i})).filter(x=>x.h.startsWith("habit_")).map(x=>{
      const name=x.h.slice(6); let hb=s.habits.find(h=>h.name===name); if(!hb){ hb={id:"h-"+uid(),name}; s.habits.push(hb); } return {i:x.i,id:hb.id}; });
    Store.save("settings",s);
    const num=v=>{ const n=parseFloat(v); return isNaN(n)?undefined:n; };
    let n=0;
    rows.slice(1).forEach(r=>{ const k=(r[ix("date")]||"").trim(); if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      setDay(k,d=>{
        [["mood","mood"],["energy","energy"],["prod","productivity"],["sleep","sleep_hours"]].forEach(([f,c])=>{ if(ix(c)>=0 && d[f]==null){ const v=num(r[ix(c)]); if(v!=null) d[f]=v; } });
        hcols.forEach(h=>{ if(r[h.i]==="1") d.habits[h.id]=true; });
        if(ix("journal")>=0 && !d.note && r[ix("journal")]) d.note=r[ix("journal")];
        if(!d.time.length) CATS.forEach(c=>{ const m=num(r[ix("min_"+c.id)]); if(m>0) d.time.push({id:uid(),cat:c.id,start:"00:00",end:pad(Math.floor(m/60)%24)+":"+pad(m%60),label:"Imported total"}); });
      },600);
      n++; });
    return `Imported ${n} day${n===1?"":"s"}.`;
  }
  return "This doesn't look like a Daybook CSV. Use a file from the Export buttons.";
}

/* ---------- render + events ---------- */
function render(){
  if(!Store.user) return;
  renderChrome();
  const v=$("#view");
  v.innerHTML = tab==="time"? viewTime() : tab==="jobs"? viewJobs() : tab==="insights"? viewInsights() : tab==="account"? viewAccount() : viewToday();
  bind();
}
function bind(){
  document.querySelectorAll("[data-habit]").forEach(b=>b.onclick=()=>{ const h=b.dataset.habit; setDay(sel,d=>{ if(d.habits[h]) delete d.habits[h]; else d.habits[h]=true; }); render(); });
  document.querySelectorAll("[data-scale]").forEach(b=>b.onclick=()=>{ const k=b.dataset.scale, val=+b.dataset.v; setDay(sel,d=>{ if(d[k]===val) delete d[k]; else d[k]=val; }); render(); });
  const sl=$("#sleep"); if(sl) sl.onchange=()=>{ const v=parseFloat(sl.value); setDay(sel,d=>{ if(isNaN(v)) delete d.sleep; else d.sleep=Math.max(0,Math.min(16,v)); }); };
  const nt=$("#note"); if(nt) nt.oninput=()=>{ setDay(sel,d=>{ d.note=nt.value; },800); const s=$("#notestate"); if(s) s.textContent="Saved on this device. Syncing…"; };
  const ah=$("#addhabit"); if(ah) ah.onsubmit=e=>{ e.preventDefault(); const v=$("#newhabit").value.trim(); if(!v) return; const s=clone(Store.get("settings")||{}); s.habits=(s.habits||[]).concat({id:"h-"+uid(),name:v}); Store.save("settings",s); render(); const det=document.querySelector("details"); if(det) det.open=true; };
  document.querySelectorAll("[data-delhabit]").forEach(b=>b.onclick=()=>{ const s=clone(Store.get("settings")||{}); s.habits=(s.habits||[]).filter(h=>h.id!==b.dataset.delhabit); Store.save("settings",s); render(); const det=document.querySelector("details"); if(det) det.open=true; toast("Habit removed. Past ticks are kept."); });
  const at=$("#addtime"); if(at) at.onsubmit=e=>{ e.preventDefault(); const st=$("#tstart").value, en=$("#tend").value; if(!st||!en){ toast("Add both a start and end time."); return; }
    setDay(sel,d=>{ d.time.push({id:uid(),cat:$("#tcat").value,start:st,end:en,label:$("#tlabel").value.trim()}); }); render(); toast("Block added"); };
  document.querySelectorAll("[data-deltime]").forEach(b=>b.onclick=()=>{ setDay(sel,d=>{ d.time=d.time.filter(e=>e.id!==b.dataset.deltime); }); render(); });
  const aj=$("#addjob"); if(aj) aj.onsubmit=e=>{ e.preventDefault(); const c=$("#jco").value.trim(); if(!c) return; const j=clone(Store.get("jobs")||{items:[]}); j.items=j.items||[];
    j.items.push({id:uid(),company:c,role:$("#jrole").value.trim(),date:$("#jdate").value||todayKey(),status:$("#jstatus").value}); Store.save("jobs",j); render(); toast("Application added"); };
  document.querySelectorAll("[data-jobstatus]").forEach(s=>s.onchange=()=>{ const j=clone(Store.get("jobs")); const it=j.items.find(x=>x.id===s.dataset.jobstatus); if(it) it.status=s.value; Store.save("jobs",j); render(); });
  document.querySelectorAll("[data-deljob]").forEach(b=>b.onclick=()=>{ const j=clone(Store.get("jobs")); j.items=j.items.filter(x=>x.id!==b.dataset.deljob); Store.save("jobs",j); render(); });
  const ed=$("#exdays"); if(ed) ed.onclick=()=>exportFile("daybook-daily-log.csv",daysCSV());
  const ej=$("#exjobs"); if(ej) ej.onclick=()=>exportFile("daybook-applications.csv",jobsCSV());
  const so=$("#signout"); if(so) so.onclick=async()=>{ await Store.push(); await sb.auth.signOut(); };
  const sn=$("#syncnow"); if(sn) sn.onclick=()=>Store.pull().then(()=>{ render(); toast("Synced"); }).catch(()=>toast("Couldn't reach the server. Check your internet."));
  const fi=$("#importfile"); if(fi) fi.onchange=()=>{ const f=fi.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ const msg=importCSV(String(rd.result)); render(); const m=$("#importmsg"); if(m) m.textContent=msg; toast(msg); }; rd.readAsText(f); };
}
let toastT;
function toast(m){ let el=$(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent=m; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2800); }

const TABS=["today","time","jobs","insights","account"];
function fromHash(){ const h=location.hash.slice(1); tab=TABS.includes(h)?h:"today"; }
window.addEventListener("hashchange",()=>{ fromHash(); render(); window.scrollTo(0,0); });
$("#prev").onclick=()=>{ sel=addDays(sel,-1); render(); };
$("#next").onclick=()=>{ if(sel<todayKey()){ sel=addDays(sel,1); render(); } };
$("#gotoday").onclick=()=>{ sel=todayKey(); render(); };

/* ---------- auth ---------- */
let signup=false;
function showAuth(msg){
  $("#boot").hidden=true; $("#appview").hidden=true; $("#authview").hidden=false;
  if(msg) $("#aerr").textContent=msg;
}
$("#amode").onclick=()=>{ signup=!signup; $("#asubmit").textContent=signup?"Create account":"Sign in";
  $("#amode").textContent=signup?"Already have an account? Sign in":"New here? Create an account";
  $("#apass").autocomplete=signup?"new-password":"current-password"; $("#aerr").textContent=""; };
$("#authform").onsubmit=async e=>{
  e.preventDefault(); const email=$("#aemail").value.trim(), password=$("#apass").value;
  $("#aerr").textContent=""; $("#asubmit").disabled=true;
  try{
    if(signup){
      const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
      if(error) throw error;
      if(!data.session){ $("#aerr").textContent="Account created. Check your email, tap the confirmation link, then sign in here."; signup=true; $("#amode").click(); }
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error) throw error;
    }
  }catch(err){ $("#aerr").textContent = /Invalid login/i.test(err.message)? "Wrong email or password." : err.message; }
  finally{ $("#asubmit").disabled=false; }
};
async function enter(user){
  Store.user=user; Store.loadLocal();
  $("#authview").hidden=true; $("#boot").hidden=true; $("#appview").hidden=false;
  fromHash(); render();
  try{ await Store.pull(); }catch(e){ setSync("off"); }
  if(!Store.get("settings")) Store.save("settings",{habits:clone(DEFAULT_HABITS),created:todayKey()});
  if(!Store.get("jobs")) Store.save("jobs",{items:[]});
  render();
}

if(!sb){
  $("#boot").innerHTML = "Daybook isn't connected to a database yet.<br>Open <b>config.js</b> and paste your Supabase URL and anon key (see README step 2).";
}else{
  let current=null;
  sb.auth.onAuthStateChange((ev,session)=>{
    const u=session&&session.user;
    if(u && (!current || current.id!==u.id)){ current=u; enter(u); }
    else if(!u){ current=null; Store.user=null; showAuth(); }
  });
}

if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
})();
</script>
